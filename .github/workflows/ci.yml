name: Vedetta-AI CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Build & Compilation
        run: npm run build

      - name: Run Deterministic Scoring & MCP Server Verification
        run: |
          node -e "
            const { analyzeProspectFactual } = require('./dist/scoring/modeScorer');
            const { calculatePipelineMetrics } = require('./dist/crm/dealEngine');
            const { VedettaMcpServer } = require('./dist/mcp/mcpServer');
            const mcp = new VedettaMcpServer();
            const listRes = mcp.handleRequest({ jsonrpc: '2.0', id: 1, method: 'tools/list' });
            if (!listRes.result || listRes.result.tools.length < 2) throw new Error('MCP tools/list failed');
            const callRes = mcp.handleRequest({
              jsonrpc: '2.0',
              id: 2,
              method: 'tools/call',
              params: { name: 'vedetta_score_prospect', arguments: { company_name: 'Tech Scaleup Srl', website: 'https://techscaleup.it', mode: 'vedetta' } }
            });
            if (callRes.error || callRes.result.isError) throw new Error('MCP tools/call failed');
            console.log('Vedetta-AI deterministic engine & MCP JSON-RPC 2.0 verification passed!');
          "
